<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AO3 Companion</title>
  <link rel="stylesheet" href="popup.css">
  <script src="../lib/storage.js"></script>
  <script src="../lib/precision-scorer.js"></script>
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h2>AO3 Companion</h2>
      <p class="subtitle">Preset Manager & Tag Scorer</p>
    </header>

    <div class="card">
      <h3>⭐ Save Current Search</h3>
      <div class="input-group">
        <input type="text" id="new-preset-name" placeholder="Preset name (e.g. Favorite Search)" />
        <button id="btn-save-current" class="btn btn-primary">Save Preset</button>
      </div>
    </div>

    <div class="card">
      <h3>📚 Saved Presets</h3>
      <div id="preset-list" class="preset-list">
        <div class="empty-state">Loading presets...</div>
      </div>
    </div>

    <div class="card">
      <h3>⚙️ Match Penalty Config</h3>
      
      <div class="config-field">
        <label for="cfg-fandom-slider">Includes other fandoms?</label>
        <div class="slider-row">
          <input type="range" id="cfg-fandom-slider" min="0" max="20" step="0.5" value="2" />
          <span id="cfg-fandom-val" class="config-val-badge">2%</span>
        </div>
      </div>

      <div class="config-field">
        <label for="cfg-romance-slider">Includes other romantic relationships? (/)</label>
        <div class="slider-row">
          <input type="range" id="cfg-romance-slider" min="0" max="25" step="0.5" value="5" />
          <span id="cfg-romance-val" class="config-val-badge">5%</span>
        </div>
      </div>

      <div class="config-field">
        <label for="cfg-friendship-slider">Includes other relationships? (&amp;)</label>
        <div class="slider-row">
          <input type="range" id="cfg-friendship-slider" min="0" max="10" step="0.5" value="2" />
          <span id="cfg-friendship-val" class="config-val-badge">2%</span>
        </div>
      </div>

      <button id="btn-save-config" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">Save Penalty Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
